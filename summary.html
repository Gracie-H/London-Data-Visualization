    // Static fare values & percentile coefficients
    const TFL_FARE_MAP = { 1: 1628, 2: 1800, 3: 2120, 4: 2600, 5: 3100 };
    const NYC_ANNUAL_CARD = 1270;
    const ONS_PERCENTILE_COEFFICIENTS = [
        0.42, 0.49, 0.54, 0.58, 0.62, 0.66, 0.70, 0.73, 0.77, 0.80,
        0.84, 0.88, 0.92, 0.96, 1.00, 1.05, 1.10, 1.15, 1.21, 1.27,
        1.34, 1.41, 1.49, 1.58, 1.68, 1.80, 1.94, 2.11, 2.32, 2.60
    ];

    // Layout 
    const samplesPerColumn = 30;
    const viewWidth = 1260;
    const viewHeight = 480;
    const dotRadius = 3.2; 

   
    const getColorScale = (burden) => {
        if (burden > 9.0) return '#ef4444';
        if (burden > 6.0) return '#fbbf24';
        if (burden > 4.5) return '#818cf8';
        return '#5eead4';
    };

    // DATA PROCESSING CHANNELS 

    // Process London data array
    function getLondonDataset() {
        let sorted = [...londonRawData];
        
        // Sort by zone-burden index
        sorted.sort((a, b) => {
            if (a.zone !== b.zone) return a.zone - b.zone;
            let bBurden = (TFL_FARE_MAP[b.zone] / (b.income * ONS_PERCENTILE_COEFFICIENTS[0])) * 100;
            let aBurden = (TFL_FARE_MAP[a.zone] / (a.income * ONS_PERCENTILE_COEFFICIENTS[0])) * 100;
            return bBurden - aBurden;
        });

        let data = [];
        // Loop columns (stations) and rows (income tiers)
        sorted.forEach((station, col) => {
            for (let row = 0; row < samplesPerColumn; row++) {
                let inc = Math.floor(station.income * ONS_PERCENTILE_COEFFICIENTS[row]);
                let bur = ((TFL_FARE_MAP[station.zone] / inc) * 100).toFixed(1);
                data.push({
                    col: col, row: row, name: station.name,
                    meta: `Zone ${station.zone}, ${station.postcode}`,
                    income: inc, percentile: 5 + row * 3, burden: bur,
                    currency: '£', color: getColorScale(parseFloat(bur))
                });
            }
        });
        return { data: data, totalCols: sorted.length };
    }

    // Process NYC data array
    function getNYCDataset() {
        let sorted = [...newYorkRawData];
        let nyBoroughOrder = { "Manhattan": 1, "Brooklyn": 2, "Queens": 3, "Staten Is": 4, "Bronx": 5 };
        
        // borough hierarchy-burden index
        sorted.sort((a, b) => {
            if (nyBoroughOrder[a.borough] !== nyBoroughOrder[b.borough]) {
                return nyBoroughOrder[a.borough] - nyBoroughOrder[b.borough];
            }
            let bBurden = (NYC_ANNUAL_CARD / (b.income * ONS_PERCENTILE_COEFFICIENTS[0])) * 100;
            let aBurden = (NYC_ANNUAL_CARD / (a.income * ONS_PERCENTILE_COEFFICIENTS[0])) * 100;
            return bBurden - aBurden;
        });

        let data = [];
        
        sorted.forEach((station, col) => {
            for (let row = 0; row < samplesPerColumn; row++) {
                let inc = Math.floor(station.income * ONS_PERCENTILE_COEFFICIENTS[row]);
                let bur = ((NYC_ANNUAL_CARD / inc) * 100).toFixed(1);
                data.push({
                    col: col, row: row, name: station.name,
                    meta: `${station.borough}, ZIP ${station.zip}`,
                    income: inc, percentile: 5 + row * 3, burden: bur,
                    currency: '$', color: getColorScale(parseFloat(bur))
                });
            }
        });
        return { data: data, totalCols: sorted.length };
    }


    // D3
  
    let currentCity = 'london'; 

    function drawGraph() {
        // city
        let pack = (currentCity === 'london') ? getLondonDataset() : getNYCDataset();

        
        d3.select("#canvas-holder").html("");

        // interval spacing 
        let paddingX = viewWidth / pack.totalCols; 
        let paddingY = viewHeight / samplesPerColumn;

      
        let svg = d3.select("#canvas-holder")
            .append("svg")
            .attr("viewBox", `0 0 ${viewWidth} ${viewHeight}`)
            .attr("preserveAspectRatio", "xMidYMid meet");

      
        svg.selectAll("circle")
            .data(pack.data)
            .enter()
            .append("circle")
            .attr("cx", d => d.col * paddingX + paddingX / 2)
            .attr("cy", d => viewHeight - (d.row * paddingY + paddingY / 2))
            .attr("r", dotRadius)
            .style("fill", d => d.color)
            .style("opacity", 0.75)
            .style("cursor", "pointer")

            // Mouse hover animation behavior setup
            .on("mouseenter", function(event, d) {
                svg.selectAll("circle").style("opacity", 0.15); // Fade 
                d3.select(this).attr("r", dotRadius * 1.8).style("opacity", 1.0); 

                
                d3.select("#audit-info").html(`
                    <div style="font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 4px;">${d.name}</div>
                    <div style="color: #6b7280; font-size: 10px; margin-bottom: 10px;">${d.meta}</div>
                    <div style="font-size: 11px;">Stratum Layer: <span style="color: #fbbf24; font-weight: 700;">${d.percentile}th</span></div>
                    <div style="font-size: 11px;">Income: <span style="color: #fff;">${d.currency}${d.income.toLocaleString()}</span></div>
                    <div style="margin-top: 8px; padding-top: 6px; border-top: 1px dashed #1f2937; font-size: 11px;">
                        Burden Index: <span style="color: ${d.color}; font-weight: 700; font-size: 14px;">${d.burden}%</span>
                    </div>
                `);
            })
            
            .on("mouseleave", function() {
                svg.selectAll("circle").style("opacity", 0.75).attr("r", dotRadius);
            });
    }

  
    drawGraph();

        if (currentCity === 'london') {
            currentCity = 'nyc';
            d3.select(this).text("Switch to London");
            d3.select("#matrixLabel").text("NEW YORK: BOROUGH SPATIAL AUDIT");
        } else {
            currentCity = 'london';
            d3.select(this).text("Switch to New York");
            d3.select("#matrixLabel").text("LONDON: STRUCTURAL ZONAL PENALTY");
        }
        
        drawGraph();
        
        d3.select("#audit-info").html(`<span style="color: #4b5563; font-style: italic;">// METRICS RESET.<br>// HOVER ANY DOT ON THE RIGHT TO DECODE METRICS LIVE.</span>`);
    });
</script>
